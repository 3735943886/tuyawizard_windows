name: Build Windows EXE

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build single-file EXE
        run: >
          pyinstaller
          --onefile
          --name tuyawizard
          --collect-all tuyawizard
          --collect-all rustuya
          run.py

      - name: Package EXE as zip
        shell: pwsh
        run: Compress-Archive -Path dist/tuyawizard.exe -DestinationPath dist/tuyawizard-windows.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tuyawizard-windows
          path: dist/tuyawizard-windows.zip
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/tuyawizard-windows.zip
